overrides:
  # The app is zoneless (no zone.js devDependency, no provideZoneChangeDetection
  # anywhere). @angular/core, @ionic/angular, and @analogjs/vitest-angular all
  # still list zone.js as an OPTIONAL peer, and pnpm's default peer-resolution
  # eagerly satisfies optional peers whenever a compatible version is
  # resolvable — so it keeps getting pulled back in on every `pnpm install`
  # even with no direct dependency on it. `-` tells pnpm to never resolve it.
  'zone.js': '-'
  '@angular-devkit/core': 22.1.5
  '@angular-devkit/schematics': 22.1.5
  '@angular/router': 22.1.3
  '@angular/platform-server': 22.1.3
  '@angular/platform-browser-dynamic': 22.1.3
  '@angular/platform-browser': 22.1.3
  '@angular/forms': 22.1.3
  '@angular/core': 22.1.3
  '@angular/common': 22.1.3
  '@angular/animations': 22.1.3
  '@sneat/api-firebase-auth': 0.27.11
  '@sneat/api-public': 0.27.11
  '@sneat/api': 0.27.11
  '@sneat/app-auth': 0.27.11
  '@sneat/app-ionic': 0.27.11
  '@sneat/app-public': 0.27.11
  '@sneat/app': 0.27.11
  '@sneat/auth-core': 0.27.11
  '@sneat/auth-models': 0.27.11
  '@sneat/auth-ui': 0.27.11
  '@sneat/components': 0.27.11
  '@sneat/core-public': 0.27.11
  '@sneat/core': 0.27.11
  '@sneat/data': 0.27.11
  '@sneat/datagrid': 0.27.11
  '@sneat/dto': 0.27.11
  '@sneat/extension-calendarius-contract': 0.27.6
  '@sneat/extension-calendarius-internal': 0.27.2
  '@sneat/extension-calendarius-shared': 0.27.2
  '@sneat/grid': 0.27.11
  '@sneat/logging': 0.27.11
  '@sneat/space-components': 0.27.11
  '@sneat/space-models': 0.27.11
  '@sneat/space-nav-ionic': 0.27.11
  '@sneat/space-nav-router': 0.27.11
  '@sneat/space-services': 0.27.11
  '@sneat/ui': 0.27.11
  '@sneat/wizard': 0.27.11
  '@angular/compiler': 22.1.3
  # Dependabot CVE fixes forced onto transitive deps (firebase@12 / dev tooling).
  # `>=` floors so pnpm resolves the highest compatible patched version rather
  # than pinning. Prune an entry once the direct dep that pulls the vulnerable
  # range is itself bumped past it. NOTE: esbuild + piscina are deliberately NOT
  # overridden — they are pinned by @angular/build and forcing them regresses the
  # Angular compiler build; they clear when Angular itself is bumped (blocked on a
  # coordinated @angular/* + @ionic/angular upgrade — 21.2.17 breaks Ionic 8.8.6's
  # proxy re-exports with NG3004).
  '@babel/core': '>=7.29.6'
  '@vitest/ui': '>=4.1.0'
  form-data: '>=4.0.6'
  vite: '>=7.3.5'
  vitest: '>=4.1.0'
  http-proxy-middleware: '>=3.0.7'
  js-yaml: '>=4.2.0'
  postcss: '>=8.5.10'
  qs: '>=6.15.2'
  tmp: '>=0.2.7'
  undici: '>=7.28.0'
  uuid: '>=11.1.1'
  webpack-dev-server: '>=5.2.5'
# Bound workspace-member discovery to the real source packages (root + libs).
# Without this, pnpm globs every package.json — including dist/ build copies —
# so `pnpm install` after a build fails with ERR_PNPM_OUTDATED_LOCKFILE.
# landings/ is its own separate workspace and is intentionally excluded.
packages:
  - 'apps/*'
  - 'libs/**'
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@sneat/*'
onlyBuiltDependencies:
  - '@firebase/util'
  - '@parcel/watcher'
  - '@swc/core'
  - core-js
  - esbuild
  - less
  - lmdb
  - msgpackr-extract
  - nx
  - protobufjs
  - unrs-resolver
